<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#637087"/></marker></defs><rect width="1000" height="1260" fill="white"/><g font-family="Microsoft YaHei,Arial" text-anchor="middle" fill="#17243b"><text x="500" y="40" font-size="25">批发单分批来货与解绑移库流程</text><rect x="110" y="75" width="780" height="100" rx="10" fill="#edf3ff" stroke="#91a9c8"/><text x="500" y="115" font-size="20">分批来货 · 质检按仓库规则分配批发／小包</text><text x="500" y="148" font-size="16" fill="#637087">修改实收数量后自动重算</text><path d="M500 175V210" stroke="#637087" stroke-width="2" marker-end="url(#a)"/><rect x="110" y="220" width="780" height="100" rx="10" fill="#edf3ff" stroke="#91a9c8"/><text x="500" y="260" font-size="20">贴标：SKU扫码定位，输入总量，前端分摊</text><text x="500" y="293" font-size="16" fill="#637087">批发标签定位采购单＋SKU；非0数量不一致提示重打</text><path d="M500 320V355" stroke="#637087" stroke-width="2" marker-end="url(#a)"/><rect x="110" y="365" width="780" height="100" rx="10" fill="#edf3ff" stroke="#91a9c8"/><text x="500" y="405" font-size="20">操作栏打印条码／重打批发标签</text><text x="500" y="438" font-size="16" fill="#637087">推荐货位：最大货品数＋剩余体积；订单已有货位优先</text><path d="M500 465V500" stroke="#637087" stroke-width="2" marker-end="url(#a)"/><rect x="110" y="510" width="780" height="100" rx="10" fill="#edf3ff" stroke="#91a9c8"/><text x="500" y="550" font-size="20">实际上架 · 批发货位仅限制最大货品数</text><text x="500" y="583" font-size="16" fill="#637087">允许同一批发货物上多个货位</text><path d="M500 610V645" stroke="#637087" stroke-width="2" marker-end="url(#a)"/><rect x="110" y="655" width="780" height="100" rx="10" fill="#eef8f1" stroke="#91a9c8"/><text x="500" y="695" font-size="20">回传实际增量 · 订单自动预占批发库存</text><text x="500" y="728" font-size="16" fill="#637087">采购单全部上架、完结且同步完整后，普通库存补足</text><path d="M500 755V790" stroke="#637087" stroke-width="2" marker-end="url(#a)"/><rect x="110" y="800" width="780" height="100" rx="10" fill="#eef8f1" stroke="#91a9c8"/><text x="500" y="840" font-size="20">库存满足则流转；不足则待库存并显示缺口</text><text x="500" y="873" font-size="16" fill="#637087">上架后解绑分支见下方</text><path d="M500 900V935" stroke="#637087" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/><rect x="110" y="945" width="780" height="100" rx="10" fill="#eef8f1" stroke="#91a9c8"/><text x="500" y="985" font-size="20">上架后解绑成功</text><text x="500" y="1018" font-size="16" fill="#637087">通知配置仓库人员；自动生成“批发转普通”移库任务</text><path d="M500 1045V1080" stroke="#637087" stroke-width="2" marker-end="url(#a)"/><rect x="110" y="1090" width="780" height="100" rx="10" fill="#eef8f1" stroke="#91a9c8"/><text x="500" y="1130" font-size="20">推荐普通目标货位并执行移库</text><text x="500" y="1163" font-size="16" fill="#637087">优先有库存且放得下的正常货位，否则推荐合规空货位</text></g></svg>