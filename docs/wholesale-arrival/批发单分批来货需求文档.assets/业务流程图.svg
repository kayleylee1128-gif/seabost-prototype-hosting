<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1220" viewBox="0 0 1000 1220" role="img" aria-labelledby="title"><title id="title">批发单分批来货处理流程</title><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#637087"/></marker></defs><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#17243b;font-size:17px;text-anchor:middle}.box{fill:#edf3ff;stroke:#7598dc;stroke-width:1.5}.oms{fill:#eef8f1;stroke:#66a97c;stroke-width:1.5}.decision{fill:#fff7e7;stroke:#c49a42;stroke-width:1.5}.line{fill:none;stroke:#637087;stroke-width:2;marker-end:url(#arrow)}.small{font-size:14px;fill:#637087}</style><rect width="1000" height="1220" fill="white"/><text x="500" y="40" style="font-size:24px;font-weight:bold">批发单分批来货处理流程</text><text x="500" y="70" class="small">蓝色：仓库处理　绿色：订单处理　黄色：条件判断</text>
<rect class="box" x="265" y="95" width="470" height="60" rx="10"/><text x="500" y="132">分批到货 · 质检录入本次实收数量</text>
<path class="line" d="M500 155V180"/><rect class="box" x="265" y="180" width="470" height="85" rx="10"/><text x="500" y="213">按仓库规则分配并展示批发／小包数量</text><text x="500" y="242" class="small">规则1：批发优先　规则2：普通小包优先</text>
<path class="line" d="M500 265V290"/><polygon class="decision" points="500,290 680,345 500,400 320,345"/><text x="500" y="350">是否经过贴标？</text>
<path class="line" d="M320 345H190V425"/><text x="250" y="334" class="small">是</text><rect class="box" x="35" y="425" width="330" height="85" rx="10"/><text x="200" y="455">小包、批发分别输入贴标数量</text><text x="200" y="483" class="small">每个BO单独输入，左侧显示BO单号</text>
<path class="line" d="M680 345H805V425"/><text x="747" y="334" class="small">否</text><rect class="box" x="635" y="425" width="330" height="85" rx="10"/><text x="800" y="459">使用质检节点对应批发数量</text><text x="800" y="486" class="small">按BO、SKU及批次关联记录</text>
<path class="line" d="M200 510V550H500V580"/><path class="line" d="M800 510V550H500"/><rect class="box" x="265" y="580" width="470" height="90" rx="10"/><text x="500" y="612">扫描批发单 · 查询贴标或质检记录</text><text x="500" y="641" class="small">扣除已上架数量后显示；不截取条码数量</text>
<path class="line" d="M735 625H850V705"/><rect x="770" y="705" width="205" height="60" rx="8" fill="#fff0f0" stroke="#d28b8b"/><text x="872" y="730" class="small">记录缺失／归属不明</text><text x="872" y="751" class="small">提示原因并阻断提交</text>
<path class="line" d="M500 670V695"/><rect class="box" x="265" y="695" width="470" height="65" rx="10"/><text x="500" y="735">实际上架 · 按库存类型回传本次增量</text>
<path class="line" d="M500 760V785"/><rect class="oms" x="265" y="785" width="470" height="65" rx="10"/><text x="500" y="825">订单系统更新库存，自动预占实际批发库存</text>
<path class="line" d="M500 850V875"/><polygon class="decision" points="500,875 730,935 500,995 270,935"/><text x="500" y="929">采购单全部上架且完结</text><text x="500" y="953">并且数据同步完整？</text>
<path class="line" d="M270 935H140V995"/><text x="220" y="922" class="small">否</text><rect class="oms" x="25" y="995" width="220" height="65" rx="8"/><text x="135" y="1024">等待后续上架、完结</text><text x="135" y="1047" class="small">或数据同步后重新校验</text>
<path class="line" d="M500 995V1020"/><text x="526" y="1011" class="small">是</text><rect class="oms" x="300" y="1020" width="400" height="65" rx="10"/><text x="500" y="1060">剩余订单需求校验并预占普通可用库存</text>
<path class="line" d="M500 1085V1110H280V1130"/><path class="line" d="M500 1110H750V1130"/><text x="300" y="1100" class="small">库存满足</text><text x="725" y="1100" class="small">库存不足</text><rect class="oms" x="140" y="1130" width="280" height="60" rx="10"/><text x="280" y="1167">完成预占，流转单据</text><rect class="oms" x="610" y="1130" width="280" height="60" rx="10"/><text x="750" y="1167">保持待库存状态，显示缺口</text></svg>